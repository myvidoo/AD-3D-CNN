# ============================================================
# AD_CNN_code unified configuration (the single path entry point)
# Reproducers only need to edit this file to run on any machine.
# Corresponding paper: "CN/MCI/AD Classification of Alzheimer's Disease from
#   Single-Modality Structural MRI Alone: 3D Convolutional Neural Network,
#   Controlled Baselines, and the Limits of Cross-Cohort Generalization"
#
# Notes:
#   - Training images (NIfTI from ADNI / MIRIAD / OASIS-2) are subject to the
#     data-use agreement (DUA); this code package does not distribute images.
#     Reproducers must apply for and download them, complete preprocessing as
#     described in preprocess/README.md, and then fill in the local paths for
#     data_root / adni_excel / miriad_root / oasis2_root below.
#   - The paper's evaluation results (Table 2, Figures 2-4, Figure S4, etc.) can be
#     reproduced from the distributed 144 per-sample prediction probabilities
#     (data/ensemble_test_predictions.csv) alone, with no images and no GPU.
#
# On the random seed and training hyperparameters (important, do not modify):
#   - The global random seed GLOBAL_SEED=42, early-stopping patience
#     EARLY_STOP_PATIENCE=15, checkpoint interval CHECKPOINT_INTERVAL=20 and the
#     workers NUM_WORKERS=4 are all methodological constants, hard-coded at the top
#     of common/utils.py. Fixing the seed is the fundamental guarantee for
#     "reproducing every number in the paper" (the data split, parameter
#     initialisation and shuffle order all follow from it); if it is changed, the
#     144-subject test set and the results of each combination can no longer
#     reproduce the paper's values, so a command-line switch is deliberately not
#     provided.
#   - The grid-search hyperparameter grid (4 modules × 4 learning rates × 2 batch
#     sizes × 2 gradient accumulations × 2 augmentations × 2 Dropout = 256
#     combinations) is defined as a top-level constant in train/train_grid_search.py;
#     it is likewise a methodological setting and is not recommended for modification.
# ============================================================

data:
  # Root directory of preprocessed NIfTI (fill in after generating it with the preprocessing pipeline;
  # under it, files are organised by 0/1/2 or by grouped subdirectories)
  data_root: "<AUTHOR_DATA_ROOT>/datasets/ADNI/NIfTI_organized_monailabel_mask_process_ants_20260525_fast_ws"
  # ADNI 954-subject list Excel (contains file_path / label columns; generated by the
  # preprocessing pipeline; an isomorphic example is in data/data_lists/)
  adni_excel: "<AUTHOR_DATA_ROOT>/MONAILabel/AD/NIfTI_organized_monailabel_mask_process_ants_20260525_fast_ws.xlsx"
  # MIRIAD external-validation root directory (scanned directly; label subdirectories
  # {0: HC, 1: AD}; no list Excel needed)
  miriad_root: "<AUTHOR_DATA_ROOT>/datasets/miriad/miriad_lastly_classified_processed_SyN_fast_ws"
  # OASIS-2 external-validation root directory (scanned directly; label subdirectories
  # {0: CN, 0.5: MCI, 1: AD})
  oasis2_root: "<AUTHOR_DATA_ROOT>/datasets/OASIS/oasis2_pro_ants_SyN_fast_ws_20260830"
  # OASIS-2 basic information list (147-subject subset, distributed with the package;
  # contains MRI ID / CDR / MMSE, used for MMSE stratification of the AD group)
  oasis2_demo: data/oasis2_basic_info.csv
  # Fixed 144-subject test-set split (distributed with the package; contains file names
  # only, joined with data_root at runtime)
  fixed_split: data/fixed_data_split.json
  # The distributed 144 per-sample prediction probabilities (offline reproduction of the
  # evaluation; no images required)
  pred_csv: data/ensemble_test_predictions.csv
  # Results of the 256 grid-search runs (data source for Figures S1–S3
  # and for the Run128 configuration; distributed with the package)
  grid_results: data/all_training_results.csv
  # ADNI subject demographics list (contains Image Data ID / Age / Sex columns;
  # distributed with the package in data/data_lists/)
  # Needed only by the controlled baselines (B1/B4/B5 in baselines/run_baselines*.py);
  # unlike adni_excel (file_path/label only), this table provides age and sex.
  adni_demo: data/data_lists/subject_summary_20260531.xlsx
  subject_summary: data/data_lists/subject_summary_20260531.xlsx

# Model weights directory (fold_1..5_best_geo.pth, the 5-fold best checkpoints of Run128,
# distributed with the package)
weights_dir: weights

# Output root directory (evaluation / plotting / baseline results are written here; the
# results/ shipped with the package already contains one set of the authors' run artifacts
# for comparison)
output_dir: results

# Run ID of the best configuration reported in the paper (axial spatial gating + lr=1e-4 +
# bs=5 + grad_accum=2 + aug=1 + dropout=0.0).
# To reproduce the final model, use this configuration together with the distributed weights
# (weights/) directly; do not rely on re-running the grid search to re-select the best — because
# of GPU floating-point non-determinism, a re-run of the 256 grid-search runs may put the best
# combination on any one of the top few (Run 128 validation AUC 0.9665 and the 0.963–0.966 of
# ranks 2–8 belong to the same performance tier), which does not change the paper's conclusions.
# If a reproducer genuinely needs to re-run the grid search and obtain a different best, this
# value may be modified.
best_run_id: 128

# Harvard-Oxford atlas and MNI template (ROI overlap analysis / Grad-CAM display /
# structural panel extraction; requires FSL or a separate download)
atlas:
  # The following three entries must be filled in by the reproducer as local absolute paths.
  # Harvard-Oxford atlas: under the FSL installation directory .../data/atlases/HarvardOxford/,
  #   or obtain it with python -c "import nilearn; print(nilearn.datasets.fetch_atlas_harvard_oxford('sub-maxprob-thr25-1mm').filename)".
  harvard_oxford_sub: "/path/to/HarvardOxford-sub-maxprob-thr25-1mm.nii.gz"
  harvard_oxford_cort: "/path/to/HarvardOxford-cort-maxprob-thr25-1mm.nii.gz"
  mni_template: "/path/to/mni_icbm152_nlin_asym_09a/mni.nii.gz"

# ============================================================
# Preprocessing pipeline (preprocess/; paper sections 2.1–2.2 / supplementary S1)
# The preprocessing scripts read the paths below (step3/step4 can also be overridden
# by command-line arguments).
# ============================================================
preprocess:
  # S1.1–S1.2: ADNI DICOM root directory and conversion output (used by step1; edited at
  # the top of the script)
  dicom_root: "<AUTHOR_DATA_ROOT>/datasets/ADNI/DICOM"
  nifti_raw_root: "<AUTHOR_DATA_ROOT>/datasets/ADNI/NIfTI_raw"
  # S1.5: MONAI Label skull-stripping annotation/output directory (used by step2; for server
  # operations see preprocess/monailabel_skullstrip_operations.md)
  skullstrip_root: "<AUTHOR_DATA_ROOT>/datasets/ADNI/NIfTI_organized_monailabel_mask_process_20260523"
  # S1.6: SyN registration input (skull-stripped NIfTI directory), MNI152 skull-stripped
  # template, and output directory (used by step3)
  register_input: "<AUTHOR_DATA_ROOT>/datasets/ADNI/NIfTI_organized_monailabel_mask_process_20260523/1"
  mni_template: "<AUTHOR_DATA_ROOT>/datasets/MNI_152/mni_icbm152_nlin_asym_09a_nifti/mni_icbm152_nlin_asym_09a/mni.nii.gz"
  register_output: "<AUTHOR_DATA_ROOT>/datasets/ADNI/NIfTI_organized_monailabel_mask_process_ants_20260525"
  # S1.7: WhiteStripe normalisation output (used by step4; i.e. the final data that data_root
  # points to)
  whitestripe_output: "<AUTHOR_DATA_ROOT>/datasets/ADNI/NIfTI_organized_monailabel_mask_process_ants_20260525_fast_ws"

# ============================================================
# Occlusion causal analysis (paper sections 2.5 / 3.3 / 4.3, supplementary S6;
# code in occlusion/)
#
# This sub-experiment uses the trained 5-fold ensemble model as a probe and applies
# fill-in occlusion to regions such as the MTL (medial temporal lobe), testing
# "whether the model really depends on the MTL".
# Inputs: the ADNI 144-subject fixed-test-set images + weights/ + Harvard-Oxford atlas +
#         MNI template; the masks and result artifacts have been released with the package
#         under occlusion/reference_results/, so **reproducing all statistics requires no
#         images and no GPU** (python occlusion/verify_occlusion.py).
# Reproduction commands are given in occlusion/README.md.
# ============================================================
occlusion:
  # Experiment working directory (masks / results / figures are created under it; relative to
  # the directory containing this file)
  work_dir: occlusion/work
  # The Grad-CAM per-sample ROI table of paper section 3.3 (contains columns such as
  # mtl_mass_frac / cam_mean)
  gradcam_per_sample_csv: results/gradcam_aggregate_v3/per_sample_results_final.csv
  # Saturation threshold (based on the baseline p0 only); the paper's main definition uses
  # the "non-saturated subset" (n=80)
  saturation_threshold: 0.999999
